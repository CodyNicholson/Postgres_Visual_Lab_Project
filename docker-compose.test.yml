# Isolated test stack: `bash scripts/test-isolated.sh` (or
# `docker compose -p postgres-lab-test -f docker-compose.yml -f docker-compose.test.yml up -d --build`).
# Renames every container, drops all host ports except the UI on :3900 and keeps the
# frontend off tunnel-net, so it never clashes with whichever app is live in the tunnel.
# Every service with a container_name in docker-compose.yml needs an entry here.
services:
  db:
    container_name: postgres-lab-test-db
    restart: "no"

  replica:
    container_name: postgres-lab-test-replica
    restart: "no"

  backend:
    container_name: postgres-lab-test-backend
    ports: !reset []
    restart: "no"

  frontend:
    container_name: postgres-lab-test-frontend
    ports: !override
      - "3900:80"
    restart: "no"
    networks: !override
      - default
